<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Pizarra / Fondo estilizado -->
  <rect x="5" y="5" width="490" height="120" rx="28" fill="url(#bgGrad)" filter="url(#glow)"/>
  <rect x="10" y="10" width="480" height="110" rx="23" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="12 6" opacity="0.6"/>

  <!-- Ícono Matemático Lúdico -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="90" height="90" rx="20" fill="#3B82F6" stroke="#93C5FD" stroke-width="4"/>
    <circle cx="28" cy="28" r="10" fill="#FBBF24"/>
    <text x="28" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#1E3A8A" text-anchor="middle">×</text>
    <circle cx="62" cy="28" r="10" fill="#34D399"/>
    <text x="62" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#064E3B" text-anchor="middle">+</text>
    <circle cx="28" cy="62" r="10" fill="#F472B6"/>
    <text x="28" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#831843" text-anchor="middle">÷</text>
    <circle cx="62" cy="62" r="10" fill="#A78BFA"/>
    <text x="62" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#4C1D95" text-anchor="middle">=</text>
  </g>

  <!-- Texto Principal -->
  <text x="140" y="68" font-family="'Arial Rounded MT Bold', 'Fredoka', 'Quicksand', 'Segoe UI', sans-serif" font-weight="900" font-size="46" fill="url(#textGrad)" letter-spacing="2" filter="url(#glow)">
    MIS TABLAS
  </text>
  <text x="142" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#E0E7FF" letter-spacing="1">
    Aventura Matemática &amp; SIMCE 4° Básico
  </text>

  <!-- Estrellas decorativas -->
  <polygon points="450,25 455,37 468,38 458,47 461,60 450,53 439,60 442,47 432,38 445,37" fill="#FDE047"/>
  <polygon points="415,85 418,93 427,94 420,100 422,109 415,104 408,109 410,100 403,94 412,93" fill="#6EE7B7"/>
  <polygon points="135,22 137,27 143,28 138,32 140,38 135,35 130,38 132,32 127,28 133,27" fill="#F472B6"/>
</svg>
