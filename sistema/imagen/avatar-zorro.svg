  <polygon points="100,165 30,85 70,120" fill="#FFF"/>
  <polygon points="100,165 170,85 130,120" fill="#FFF"/>

  <!-- Lentes de sabio -->
  <circle cx="68" cy="98" r="22" fill="none" stroke="#1E293B" stroke-width="5"/>
