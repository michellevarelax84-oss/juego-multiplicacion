<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#CA8A04" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Asas del trofeo -->
  <path d="M 40 40 C 15 40 15 90 50 100" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 160 40 C 185 40 185 90 150 100" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Copa -->
  <path d="M 45 30 L 155 30 C 155 85 130 115 100 120 C 70 115 45 85 45 30 Z" fill="url(#cupGrad)" stroke="#A16207" stroke-width="4" filter="url(#trophyGlow)"/>

  <!-- Tallo / Cuello -->
  <rect x="90" y="120" width="20" height="30" fill="url(#goldGrad)" stroke="#A16207" stroke-width="3"/>
  <ellipse cx="100" cy="148" rx="28" ry="8" fill="url(#goldGrad)" stroke="#A16207" stroke-width="3"/>

  <!-- Base del trofeo -->
  <rect x="55" y="152" width="90" height="36" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <!-- Placa dorada en la base -->
  <rect x="65" y="160" width="70" height="20" rx="4" fill="url(#goldGrad)"/>
  <text x="100" y="174" font-family="sans-serif" font-weight="900" font-size="11" fill="#78350F" text-anchor="middle">★ CAMPEÓN ★</text>

  <!-- Estrella grabada en la copa -->
  <polygon points="100,50 105,65 120,65 108,74 112,89 100,80 88,89 92,74 80,65 95,65" fill="#FFFBEB" stroke="#CA8A04" stroke-width="2"/>
  <circle cx="100" cy="71" r="5" fill="#FEF08A"/>
</svg>
